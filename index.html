<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Family FD Manager</title><meta name="theme-color" content="#172033"><link rel="manifest" href="manifest.json"><style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,sans-serif;background:#f5f7fb;color:#172033}.wrap{max-width:1050px;margin:auto;padding:20px}.top{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}h1{margin:0 0 4px}.sub{color:#687386}button{border:0;border-radius:9px;padding:10px 14px;font-weight:650;cursor:pointer}.primary{background:#172033;color:white}.secondary{background:white;border:1px solid #dce1ea}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:18px 0}.card,.panel,.authbox{background:white;border:1px solid #e3e7ef;border-radius:14px;padding:16px}.label{font-size:13px;color:#778195}.value{font-size:22px;font-weight:750;margin-top:4px}.panel{margin-top:14px}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:820px}th,td{padding:11px 8px;border-bottom:1px solid #edf0f5;text-align:left;font-size:14px}th{font-size:11px;color:#6d7788;text-transform:uppercase}.soon{font-weight:750}.alert{display:none;background:#fff7df;border:1px solid #f0d98a;color:#705500;padding:11px;border-radius:10px;margin:14px 0}.auth{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px}.authbox{width:100%;max-width:410px}.authbox input{width:100%;padding:11px;margin:6px 0 12px;border:1px solid #d8dee8;border-radius:9px}.msg{color:#b42318;min-height:20px;font-size:14px}.modal{display:none;position:fixed;inset:0;background:#0007;align-items:center;justify-content:center;padding:16px}.modal.open{display:flex}.box{background:white;border-radius:16px;padding:20px;max-width:520px;width:100%}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{display:flex;flex-direction:column;gap:5px}.full{grid-column:1/-1}input{padding:10px;border:1px solid #d8dee8;border-radius:9px}.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}@media(max-width:700px){.cards{grid-template-columns:1fr}.grid{grid-template-columns:1fr}.full{grid-column:auto}}
</style></head><body>
<div id="login" class="auth"><div class="authbox"><h1>Family FD Manager</h1><p class="sub">Shared family fixed-deposit tracker</p><div id="msg" class="msg"></div><label>Email</label><input id="email" type="email"><label>Password</label><input id="password" type="password"><button class="primary" style="width:100%" onclick="login()">Log in</button><button class="secondary" style="width:100%;margin-top:8px" onclick="signup()">Create account</button></div></div>
<div id="app" style="display:none"><div class="wrap"><div class="top"><div><h1>Family FD Manager</h1><div class="sub">Shared family FD records</div></div><div><button class="primary" onclick="openForm()">＋ Add FD</button> <button class="secondary" onclick="exportExcel()">📥 Export Excel</button> <button class="secondary" onclick="logout()">Log out</button></div></div>
<div id="alert" class="alert"></div><div class="cards"><div class="card"><div class="label">Total FDs</div><div class="value" id="count">0</div></div><div class="card"><div class="label">Total Invested Amount</div><div class="value" id="invested">₹0</div></div><div class="card"><div class="label">Total Maturity Amount</div><div class="value" id="maturity">₹0</div></div></div>
<div class="panel">
<div style="display:flex;gap:10px;align-items:end;flex-wrap:wrap;margin-bottom:14px">
<div><label style="font-size:12px;color:#687386">Bank Name</label><br><select id="bankFilter" onchange="applyFilters()" style="padding:10px;border:1px solid #d8dee8;border-radius:9px;min-width:170px"><option value="">All Banks</option></select></div>
<div><label style="font-size:12px;color:#687386">Depositor Name</label><br><select id="memberFilter" onchange="applyFilters()" style="padding:10px;border:1px solid #d8dee8;border-radius:9px;min-width:170px"><option value="">All Depositors</option></select></div>
<button class="secondary" onclick="clearFilters()">Clear Filters</button>
</div>
<h2 style="font-size:19px">All Fixed Deposits</h2><div class="table-wrap"><table><thead><tr><th>Member</th><th>Bank</th><th>Opening</th><th>Maturity</th><th>Rate</th><th>Invested</th><th>Maturity</th><th>When</th><th></th></tr></thead><tbody id="rows"></tbody></table></div><div id="empty" style="text-align:center;padding:25px;color:#778195">No FDs added yet.</div></div></div></div>
<div id="modal" class="modal"><div class="box"><h2 id="formTitle">Add FD</h2><form id="fdform"><input type="hidden" id="editId"><div class="grid"><div class="field"><label>Family Member</label><input id="member" required></div><div class="field"><label>Bank Name</label><input id="bank" required></div><div class="field"><label>Date of Opening</label><input id="opening" type="date" required></div><div class="field"><label>Maturity Date</label><input id="matdate" type="date" required></div><div class="field"><label>Interest Rate (%)</label><input id="rate" type="number" step=".01"></div><div class="field"><label>Invested Amount (₹)</label><input id="amount" type="number" step=".01" required></div><div class="field full"><label>Maturity Amount (₹)</label><input id="matamount" type="number" step=".01" required></div></div><div class="actions"><button type="button" class="secondary" onclick="closeForm()">Cancel</button><button class="primary">Save</button></div></form></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script><script>
const db=supabase.createClient("https://wntwsojnqxnbqhwcdljy.supabase.co","sb_publishable_g6kU3epUclX_7WFwrqpcVg_z-9sUMGH");let data=[];
const $=x=>document.getElementById(x),money=n=>new Intl.NumberFormat("en-IN",{style:"currency",currency:"INR",maximumFractionDigits:0}).format(+n||0);
function days(s){return Math.ceil((new Date(s+"T23:59:59")-new Date())/86400000)} function when(s){let d=days(s);return d<0?"Matured":d===0?"Today":d===1?"Tomorrow":"in "+d+" days"} function fmt(s){let a=s.split("-");return a[2]+"-"+a[1]+"-"+a[0]}
async function load(){let r=await db.from("fixed_deposits").select("*").order("maturity_date");if(r.error){alert(r.error.message);return}data=r.data||[];render()}
function updateFilterOptions(){
 const bs=$("bankFilter"), ms=$("memberFilter");
 if(!bs||!ms)return;
 const b0=bs.value,m0=ms.value;
 const banks=[...new Set(data.map(x=>x.bank_name).filter(Boolean))].sort((a,b)=>a.localeCompare(b));
 const members=[...new Set(data.map(x=>x.family_member).filter(Boolean))].sort((a,b)=>a.localeCompare(b));
 bs.innerHTML='<option value="">All Banks</option>'+banks.map(x=>'<option value="'+safe(x)+'">'+safe(x)+'</option>').join('');
 ms.innerHTML='<option value="">All Depositors</option>'+members.map(x=>'<option value="'+safe(x)+'">'+safe(x)+'</option>').join('');
 if(banks.includes(b0))bs.value=b0;
 if(members.includes(m0))ms.value=m0;
}
function safe(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}
function filteredData(){
 const b=$("bankFilter")?.value||"",m=$("memberFilter")?.value||"";
 return data.filter(x=>(!b||x.bank_name===b)&&(!m||x.family_member===m));
}
function applyFilters(){render()}
function clearFilters(){if($("bankFilter"))$("bankFilter").value="";if($("memberFilter"))$("memberFilter").value="";render()}
function render(){
 updateFilterOptions();
 const shown=filteredData();
 $("count").textContent=shown.length;
 $("invested").textContent=money(shown.reduce((s,x)=>s+ +x.invested_amount,0));
 $("maturity").textContent=money(shown.reduce((s,x)=>s+ +x.maturity_amount,0));
 $("rows").innerHTML="";
 for(let x of shown){
   let d=days(x.maturity_date),tr=document.createElement("tr");
   tr.innerHTML="<td>"+safe(x.family_member)+"</td><td>"+safe(x.bank_name)+"</td><td>"+fmt(x.opening_date)+"</td><td>"+fmt(x.maturity_date)+"</td><td>"+(x.interest_rate??"-")+"%</td><td>"+money(x.invested_amount)+"</td><td>"+money(x.maturity_amount)+"</td><td class='"+(d>=0&&d<=30?"soon":"")+"'>"+when(x.maturity_date)+"</td><td><button class='secondary' onclick='edit("+x.id+")'>Edit</button> <button class='secondary' onclick='del("+x.id+")'>Delete</button></td>";
   $("rows").appendChild(tr);
 }
 $("empty").style.display=shown.length?"none":"block";
 let n=shown.filter(x=>days(x.maturity_date)>=0&&days(x.maturity_date)<=30).length;
 $("alert").style.display=n?"block":"none";
 if(n)$("alert").textContent="🔔 "+n+" FD(s) mature within 30 days.";
}

function openForm(id){$("modal").classList.add("open");$("fdform").reset();$("editId").value=id||"";$("formTitle").textContent=id?"Edit FD":"Add FD";if(id){let x=data.find(a=>a.id==id);$("member").value=x.family_member;$("bank").value=x.bank_name;$("opening").value=x.opening_date;$("matdate").value=x.maturity_date;$("rate").value=x.interest_rate??"";$("amount").value=x.invested_amount;$("matamount").value=x.maturity_amount}}function closeForm(){$("modal").classList.remove("open")}function edit(id){openForm(id)}
$("fdform").onsubmit=async e=>{e.preventDefault();let id=$("editId").value,row={family_member:$("member").value.trim(),bank_name:$("bank").value.trim(),opening_date:$("opening").value,maturity_date:$("matdate").value,interest_rate:$("rate").value||null,invested_amount:$("amount").value,maturity_amount:$("matamount").value};let r=id?await db.from("fixed_deposits").update(row).eq("id",id):await db.from("fixed_deposits").insert(row);if(r.error)alert(r.error.message);else{closeForm();load()}}
async function del(id){if(confirm("Delete this FD?")){let r=await db.from("fixed_deposits").delete().eq("id",id);if(r.error)alert(r.error.message);else load()}}
function exportExcel(){
  if(!filteredData().length){ alert("There are no FD records matching the current filter."); return; }
  const rows = filteredData().map(x => ({
    "Family Member": x.family_member,
    "Bank Name": x.bank_name,
    "Date of Opening": x.opening_date,
    "Maturity Date": x.maturity_date,
    "Interest Rate (%)": x.interest_rate ?? "",
    "Invested Amount (₹)": Number(x.invested_amount || 0),
    "Maturity Amount (₹)": Number(x.maturity_amount || 0),
    "Matures": when(x.maturity_date)
  }));
  const ws = XLSX.utils.json_to_sheet(rows);
  ws["!cols"] = [
    {wch:20},{wch:18},{wch:16},{wch:16},{wch:16},{wch:20},{wch:20},{wch:18}
  ];
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, "Fixed Deposits");
  const visible = filteredData();
  const totalInvested = visible.reduce((s,x)=>s+Number(x.invested_amount||0),0);
  const totalMaturity = visible.reduce((s,x)=>s+Number(x.maturity_amount||0),0);
  const summary = XLSX.utils.aoa_to_sheet([
    ["Family FD Manager Summary"],
    ["Total FDs", filteredData().length],
    ["Total Invested Amount", totalInvested],
    ["Total Maturity Amount", totalMaturity],
    ["Exported On", new Date().toLocaleString("en-IN")]
  ]);
  summary["!cols"]=[{wch:28},{wch:24}];
  XLSX.utils.book_append_sheet(wb, summary, "Summary");
  XLSX.writeFile(wb, "family-fd-manager.xlsx");
}
async function login(){let r=await db.auth.signInWithPassword({email:$("email").value,password:$("password").value});if(r.error)$("msg").textContent=r.error.message}async function signup(){let r=await db.auth.signUp({email:$("email").value,password:$("password").value});$("msg").textContent=r.error?r.error.message:"Account created. Check your email if confirmation is enabled."}async function logout(){await db.auth.signOut()}
db.auth.onAuthStateChange((e,s)=>{ $("login").style.display=s?"none":"flex";$("app").style.display=s?"block":"none";if(s)load()});
</script></body></html>
